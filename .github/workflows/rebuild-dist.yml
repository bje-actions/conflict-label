name: Rebuild dist

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild dist on Dependabot pull requests
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Dependabot only updates the lockfile and manifest, so a runtime
      # dependency bump would leave dist/ stale and fail the dist check in CI.
      # Push with an App token: pushes made with GITHUB_TOKEN do not trigger
      # workflow runs.
      #
      # Dependabot-triggered pull_request runs read the Dependabot secrets
      # store, not the Actions store, so APP_ID and APP_PRIVATE_KEY must be
      # configured under Settings > Secrets and variables > Dependabot. The
      # trigger stays pull_request: pull_request_target would run this
      # checkout-and-build against untrusted content with a writable token.
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Commit dist if it changed
        env:
          # Commits are attributed to the App's own bot user, so the identity
          # matches the token that pushes them.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          # gh needs a token for the users API lookup below.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Stage first: git diff alone does not see a brand new bundle file.
          git add -A dist/
          if git diff --cached --quiet; then
            echo 'dist is already up to date.'
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "${bot}"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git commit -m 'chore: rebuild dist'
          git push

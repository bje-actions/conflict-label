version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: daily
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The action runs on the node24 runtime; keep the types on the same major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
